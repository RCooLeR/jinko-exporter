name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Check formatting
        working-directory: bridge
        run: test -z "$(gofmt -l .)"

      - name: Vet
        working-directory: bridge
        run: go vet ./...

      - name: Test
        working-directory: bridge
        run: go test ./... -race -cover

      - name: Staticcheck
        working-directory: bridge
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Govulncheck
        working-directory: bridge
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  ha-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ha-cards/package-lock.json

      - name: Install dependencies
        working-directory: ha-cards
        run: npm ci

      - name: Test
        working-directory: ha-cards
        run: npm test

      - name: Build
        working-directory: ha-cards
        run: npm run build
