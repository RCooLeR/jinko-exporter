name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  ACTIONLINT_VERSION: v1.7.12
  STATICCHECK_VERSION: v0.8.2
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  bridge:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Check formatting
        working-directory: bridge
        run: test -z "$(gofmt -l .)"

      - name: Check module files
        working-directory: bridge
        run: go mod tidy -diff

      - name: Lint workflows
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          actionlint

      - name: Vet
        working-directory: bridge
        run: go vet ./...

      - name: Test
        working-directory: bridge
        run: go test ./... -race -cover

      - name: Staticcheck
        working-directory: bridge
        run: |
          go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          staticcheck ./...

      - name: Govulncheck
        working-directory: bridge
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          govulncheck ./...

  docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Check bridge Dockerfile
        run: docker buildx build --check -f bridge/Dockerfile bridge

      - name: Build bridge image
        run: docker buildx build --load --platform linux/amd64 --build-arg VERSION=ci --build-arg "COMMIT=${GITHUB_SHA}" --build-arg "DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -f bridge/Dockerfile -t jinko-exporter:ci bridge

  cards:
    name: cards (${{ matrix.directory }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        directory:
          - ha-cards
          - new-ha-cards
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Set up pinned npm
        working-directory: ${{ matrix.directory }}
        run: npm install --global "$(node --print "require('./package.json').packageManager")"

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Check
        working-directory: ${{ matrix.directory }}
        run: npm run check

  release-config:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: check

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            ha-cards/package-lock.json
            new-ha-cards/package-lock.json

      - name: Set up pinned npm
        working-directory: ha-cards
        run: npm install --global "$(node --print "require('./package.json').packageManager")"

      - name: Build canonical release card
        working-directory: ha-cards
        run: |
          npm ci
          npm run build

      - name: Build redesigned release card
        working-directory: new-ha-cards
        run: |
          npm ci
          npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build full GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean
